services:
  # The DEFAULT service (architecture.md §7, docs/app-shell-arbeitsauftrag.md) - `docker compose up`
  # alone now starts THIS: @qu/app-shell in PLATFORM mode (a Relay-Admin-owned #/admin console + as
  # many CMS-managed shell-apps as you register, docs §19-21), not the old hardcoded chat demo below
  # (which moved to the opt-in "legacy-chat" profile - see its own comment further down). Starts with
  # ZERO configuration into PLATFORM mode already (a landing page, "noch keine Anwendung installiert",
  # not a setup screen) - relay-server.js's own "BOOTSTRAP RELAY-ADMIN" doc comment: this relay
  # always admits a self-generated bootstrap relay-admin, persisted at /data/relay-bootstrap-admin.json
  # (the volume below), on top of QU_RELAY_ADMINS below, so PLATFORM mode never actually needs that
  # env var populated just to exist. The fastest path to an ACTUALLY-configured platform (the built-in
  # admin console installed, one CMS-managed demo shell-app) is ONE command - `bootstrap-platform.mjs`
  # itself now PREFERS that same auto-generated identity (its own "ensureRelayAdminIdentity()" doc
  # comment) whenever `--dir`/`QU_BOOTSTRAP_DIR` can see it, so NO manual pubkey pasting or redeploy
  # is needed either:
  #
  #   docker exec -it <container> npm run bootstrap:platform -- --relay ws://localhost:8081 --dir /data
  #
  # (`--dir /data` - the SAME volume this container's own relay already writes
  # `relay-bootstrap-admin.json` into, `QU_BOOTSTRAP_DIR` below defaults to it - no second identity
  # volume needed for this any more.) Running from a machine that only has network access to this
  # relay's public URL, not its filesystem, still works exactly as before: omit `--dir` (or point it
  # anywhere without a `relay-bootstrap-admin.json` in it) and the script falls back to generating its
  # own separate identity, printing the `QU_RELAY_ADMINS` pubkey to paste in and redeploy with -
  # `bootstrap-platform.mjs`'s own top doc comment has the full fallback story. Prefer your OWN pubkey
  # in QU_RELAY_ADMINS below instead of either path if you'd rather not rely on a filesystem-retrieved
  # identity at all - see that var's own comment. See the root README.md's "Deploying the App Shell"
  # section and docs/v5-space-core-guide.md §10 for the full walkthrough and every env var below.
  #
  # DOCKER STACK / SWARM (`docker stack deploy -c docker-compose.space-relay.yml <stack>`): Swarm
  # does NOT build images - `build:` below is ignored under stack deploy, and `image:` (present on
  # both services here) is what it actually pulls/runs, so build and tag it yourself FIRST (on every
  # node that needs it, or push to a registry every node can pull from):
  #   docker build -f packages/app-shell/Dockerfile -t qu-app-shell-relay:latest .
  # `profiles:` (on qu-space-relay below) is also a Compose-only concept Swarm doesn't understand -
  # under `docker stack deploy` that service deploys unconditionally too (harmless - it's just an
  # idle chat relay on a different port - remove its block from your own copy if you don't want it).
  qu-app-shell-relay:
    image: qu-app-shell-relay:latest
    build:
      context: .
      dockerfile: packages/app-shell/Dockerfile
    ports:
      - "${QU_RELAY_PORT:-8081}:8081"
    environment:
      QU_RELAY_PORT: "8081"
      QU_RELAY_DATA_DIR: /data
      # REQUIRED for this relay to actually serve an app (a PUBLIC key only - see relay-server.js's
      # own "ADMIN IDENTITY" doc comment; the container starts fine without it, serving a setup page
      # at / instead). Generate an app-admin identity yourself (QuCrypto.generateKeypair() from
      # @qu/core) and set its base64 signing pubkey here.
      QU_APP_ADMIN_PUB: ${QU_APP_ADMIN_PUB:-}
      # PLATFORM mode instead of the single app above (architecture.md §7) - takes priority over
      # QU_APP_ADMIN_PUB when both are set. JSON array of PLAIN base64 signing pubkeys, e.g.
      # ["<pub1>","<pub2>"] - every relay-admin identity, all equally and symmetrically (no single
      # "owner"), authorized to (a) write qu-platform-apps (register/manage already-installed apps
      # under path prefixes - a BRAND NEW app-admin needs no separate config here at all,
      # `registerApp()` alone is enough, discovered live by this relay itself - see @qu/app-shell's
      # own live-app-resolver.js) and (b) write the built-in admin console's own content, which lives
      # in this SAME main Space now (architecture.md §7's "One relay Space, not two" - no separate
      # Space/relay-forwarder, no /admin-ws). This is the ONE static list this whole deployment
      # needs - see @qu/space-core's kinds.js/kind-schema.js own doc comment on the 'relay-admins'
      # ACL mode, and relay-server.js's own doc comment. ANY pubkey works the moment it's listed
      # here, including an operator's own already-existing browser identity - no separate admin
      # identity to generate or import. Empty/unset still starts PLATFORM mode anyway (see
      # QU_RELAY_BOOTSTRAP_ADMIN right below) rather than falling back to single-app mode.
      QU_RELAY_ADMINS: ${QU_RELAY_ADMINS:-}
      # Default true (unset here = true) - relay-server.js's own "BOOTSTRAP RELAY-ADMIN" doc comment
      # in full: this relay ALWAYS also admits a self-generated bootstrap relay-admin identity,
      # persisted at /data/relay-bootstrap-admin.json (the SAME volume below - no second volume
      # needed) - on top of QU_RELAY_ADMINS above, never instead of it, solving the chicken-and-egg
      # problem of needing a pubkey configured before anyone can register/administer anything at
      # all. Retrieve that file (docker cp / a bind-mounted volume) to import it as your own browser
      # identity, or just add your OWN pubkey to QU_RELAY_ADMINS above and ignore it. Set to the
      # exact string "false" to disable entirely - a deployment that wants ONLY the explicitly-
      # configured list above to ever matter.
      QU_RELAY_BOOTSTRAP_ADMIN: ${QU_RELAY_BOOTSTRAP_ADMIN:-}
      # OPTIONAL - qu-page/qu-template/qu-style are 'content'-ACL (self-certifying per-owner grants,
      # @qu/app-core's kinds.js), not 'members'-ACL, so an app-admin needs no entry here just to
      # WRITE their own content. Only relevant for an app's OWN, separately-defined 'members'-ACL
      # Kinds, if any - see docs/v5-space-core-guide.md for how to generate {"pub","xPub"} entries.
      QU_MEMBERS_JSON: ${QU_MEMBERS_JSON:-}
      # Default true (unset here = true) - lets a visiting browser self-register (POST /join), which
      # a real deployment usually wants (visitors need SOME membership to even subscribe to
      # 'members'-ACL content, if you add any - see relay-server.js's own doc comment). Set to the
      # exact string "false" to lock it down.
      QU_ALLOW_JOIN: ${QU_ALLOW_JOIN:-}
      # Read by bootstrap-platform.mjs ONLY (not this relay process itself) when run via `docker
      # exec` into THIS container - defaults it to the SAME volume (/data) this relay already writes
      # its own relay-bootstrap-admin.json into, so `ensureRelayAdminIdentity()` (bootstrap-
      # platform.mjs's own doc comment) finds and reuses THAT identity directly - no second, separate
      # identity volume needed for this any more (one used to live here; removed once the script
      # learned to read relay-bootstrap-admin.json itself). Only relevant if you actually run
      # bootstrap-platform.mjs via `docker exec` into this container - irrelevant if you bootstrap
      # from outside it (also fully supported, see this file's own top comment).
      QU_BOOTSTRAP_DIR: /data
    volumes:
      - qu-app-shell-relay-data:/data
    restart: unless-stopped

  # THE OLD, hardcoded chat demo relay (packages/space-transport's own relay-server.js) - kept as an
  # explicit opt-in, not the default anymore: `docker compose --profile legacy-chat up -d` starts
  # BOTH this and qu-app-shell-relay above, on separate ports. Nothing here changed except which
  # service is the default - see demo/README.md's own "Real thing" section for how to use it.
  qu-space-relay:
    profiles: ["legacy-chat"]
    image: qu-space-relay:latest
    build:
      context: .
      dockerfile: packages/space-transport/Dockerfile
    ports:
      - "${QU_LEGACY_CHAT_RELAY_PORT:-8083}:8081"
    environment:
      QU_RELAY_PORT: "8081"
      QU_RELAY_DATA_DIR: /data
      # OPTIONAL - no default needed. A JSON array of every 'members'-mode
      # ACL peer's {"pub","xPub"} (base64) - see docs/v5-space-core-guide.md
      # for how to generate these, and for why 'owner'/'named'-ACL Kinds
      # need no members configured at all. Leave QU_LEGACY_CHAT_MEMBERS_JSON
      # unset in your .env / shell if you have none yet - the relay starts fine.
      QU_MEMBERS_JSON: ${QU_LEGACY_CHAT_MEMBERS_JSON:-}
      # OPTIONAL - a ws://.../wss://... URL of another relay to federate
      # with (see federation.js). This relay's OWN identity (auto-generated
      # and persisted under /data on first boot - see relay-identity.js) is
      # what authenticates it to the upstream relay.
      QU_FEDERATE_UPSTREAM_URL: ${QU_FEDERATE_UPSTREAM_URL:-}
      # Default true (unset here = true) - anyone reaching this port can
      # join the demo app at / as a new 'members'-mode member, no auth
      # beyond well-formed keys. Set to the exact string "false" to lock
      # membership to QU_LEGACY_CHAT_MEMBERS_JSON only - see relay-server.js's
      # own doc comment.
      QU_ALLOW_JOIN: ${QU_LEGACY_CHAT_ALLOW_JOIN:-}
    volumes:
      - qu-space-relay-data:/data
    restart: unless-stopped

volumes:
  qu-app-shell-relay-data:
  qu-space-relay-data:
