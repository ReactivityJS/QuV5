services:
  qu-space-relay:
    build:
      context: .
      dockerfile: packages/space-transport/Dockerfile
    ports:
      - "${QU_RELAY_PORT:-8081}:8081"
    environment:
      QU_RELAY_PORT: "8081"
      QU_RELAY_DATA_DIR: /data
      # OPTIONAL - no default needed. A JSON array of every 'members'-mode
      # ACL peer's {"pub","xPub"} (base64) - see docs/v5-space-core-guide.md
      # for how to generate these, and for why 'owner'/'named'-ACL Kinds
      # need no members configured at all. Leave QU_MEMBERS_JSON unset in
      # your .env / shell if you have none yet - the relay starts fine.
      QU_MEMBERS_JSON: ${QU_MEMBERS_JSON:-}
      # OPTIONAL - a ws://.../wss://... URL of another relay to federate
      # with (see federation.js). This relay's OWN identity (auto-generated
      # and persisted under /data on first boot - see relay-identity.js) is
      # what authenticates it to the upstream relay.
      QU_FEDERATE_UPSTREAM_URL: ${QU_FEDERATE_UPSTREAM_URL:-}
      # Default true (unset here = true) - anyone reaching this port can
      # join the demo app at / as a new 'members'-mode member, no auth
      # beyond well-formed keys. Set to the exact string "false" to lock
      # membership to QU_MEMBERS_JSON only - see relay-server.js's own doc
      # comment.
      QU_ALLOW_JOIN: ${QU_ALLOW_JOIN:-}
    volumes:
      - qu-space-relay-data:/data
    restart: unless-stopped

  # The generic-app counterpart (docs/app-shell-arbeitsauftrag.md, architecture.md §7) - a SEPARATE
  # relay/Space/port serving @qu/app-shell instead of the hardcoded chat demo above. Opt-in via the
  # "app-shell" Compose profile so `docker compose up` alone still starts ONLY qu-space-relay,
  # unchanged: `docker compose --profile app-shell up -d` starts both.
  qu-app-shell-relay:
    profiles: ["app-shell"]
    build:
      context: .
      dockerfile: packages/app-shell/Dockerfile
    ports:
      - "${QU_APP_SHELL_RELAY_PORT:-8082}:8081"
    environment:
      QU_RELAY_PORT: "8081"
      QU_RELAY_DATA_DIR: /data
      # REQUIRED for this relay to actually serve an app (a PUBLIC key only - see relay-server.js's
      # own "ADMIN IDENTITY" doc comment; the container starts fine without it, serving a setup page
      # at / instead). Generate an app-admin identity yourself (QuCrypto.generateKeypair() from
      # @qu/core) and set its base64 signing pubkey here.
      QU_APP_ADMIN_PUB: ${QU_APP_ADMIN_PUB:-}
      # PLATFORM mode instead of the single app above (architecture.md §7) - set a relay-admin's
      # base64 signing pubkey here to own the qu-platform-apps alias registry, from which that
      # identity can register however many already-installed apps under path prefixes. Takes
      # priority over QU_APP_ADMIN_PUB when both are set - see relay-server.js's own doc comment.
      QU_RELAY_ADMIN_PUB: ${QU_RELAY_ADMIN_PUB:-}
      # PLATFORM mode only - JSON array of every ORDINARY app-admin pubkey this relay should accept
      # content writes from (a STATIC, boot-time list - see relay-server.js's own doc comment on
      # why). Irrelevant to the admin realm itself - see QU_RELAY_ADMIN_MEMBERS_JSON below.
      QU_APP_ADMIN_PUBS: ${QU_APP_ADMIN_PUBS:-}
      # The CONFIDENTIAL admin realm's own membership (architecture.md §7's "ADMIN REALM") - a
      # wholly separate Space/relay-forwarder from the main one above, reached at /admin-ws, never
      # open-join. JSON array of {"pub","xPub"} (base64) - every identity trusted to read/write the
      # built-in admin console's own content. Empty/unset still starts the admin realm (so it CAN be
      # bootstrapped - see packages/app-shell/bin/install-admin-console.mjs) but nobody can decrypt
      # anything written to it yet.
      QU_RELAY_ADMIN_MEMBERS_JSON: ${QU_RELAY_ADMIN_MEMBERS_JSON:-}
      # REQUIRED (once you have QU_APP_ADMIN_PUB) for the app-admin to actually be able to write
      # qu-page/qu-template/qu-style content - see @qu/app-core's kinds.js on why those are
      # 'members'-ACL. At minimum: [{"pub":"<same as QU_APP_ADMIN_PUB>","xPub":"<its X25519 pubkey>"}].
      QU_MEMBERS_JSON: ${QU_APP_SHELL_MEMBERS_JSON:-}
      QU_ALLOW_JOIN: ${QU_APP_SHELL_ALLOW_JOIN:-}
    volumes:
      - qu-app-shell-relay-data:/data
    restart: unless-stopped

volumes:
  qu-space-relay-data:
  qu-app-shell-relay-data:
