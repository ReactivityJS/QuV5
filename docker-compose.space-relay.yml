services:
  # The DEFAULT service (architecture.md §7, docs/app-shell-arbeitsauftrag.md) - `docker compose up`
  # alone now starts THIS: @qu/app-shell in PLATFORM mode (a Relay-Admin-owned #/admin console + as
  # many CMS-managed shell-apps as you register, docs §19-21), not the old hardcoded chat demo below
  # (which moved to the opt-in "legacy-chat" profile - see its own comment further down). Starts fine
  # with zero configuration (a setup page instead of an app/platform) - the fastest path to an
  # actually-configured platform, including the built-in admin console and one CMS-managed demo
  # shell-app, is ONE command run from anywhere with network access to this relay's URL (ideally
  # from OUTSIDE this container's own lifecycle entirely - your own laptop, a CI runner - and not
  # tied to any particular deployment method - see its own doc comment on why):
  #
  #   node packages/app-shell/bin/bootstrap-platform.mjs --relay ws://<this-host>:8081
  #
  # It prints an environment: block (QU_RELAY_ADMINS) to paste below yourself and redeploy with - it
  # never writes this file or any deployment config for you. See the root README.md's "Deploying the
  # App Shell" section and docs/v5-space-core-guide.md §10 for the full walkthrough and every env var
  # below.
  #
  # RUNNING IT VIA `docker exec` INSTEAD (e.g. `docker exec -it <container> npm run
  # bootstrap:platform` - common on managed platforms like Rancher/Kubernetes where exposing an
  # extra port or a separate toolchain is inconvenient): THIS WORKS, but only because
  # `qu-app-shell-relay-admin-identity` below is mounted at `QU_BOOTSTRAP_DIR` - without a
  # persistent volume there, the relay-admin identity this generates lives on the CONTAINER's own
  # ephemeral filesystem and is silently LOST on every redeploy, printing a brand-new
  # QU_RELAY_ADMINS every time and orphaning whatever the OLD identity had already installed in the
  # admin realm (bootstrap-platform.mjs's own top doc comment, "PERSISTING THE IDENTITY DIRECTORY" -
  # a real, observed failure mode, not a hypothetical one). Back up that volume like you would any
  # other private key.
  #
  # DOCKER STACK / SWARM (`docker stack deploy -c docker-compose.space-relay.yml <stack>`): Swarm
  # does NOT build images - `build:` below is ignored under stack deploy, and `image:` (present on
  # both services here) is what it actually pulls/runs, so build and tag it yourself FIRST (on every
  # node that needs it, or push to a registry every node can pull from):
  #   docker build -f packages/app-shell/Dockerfile -t qu-app-shell-relay:latest .
  # `profiles:` (on qu-space-relay below) is also a Compose-only concept Swarm doesn't understand -
  # under `docker stack deploy` that service deploys unconditionally too (harmless - it's just an
  # idle chat relay on a different port - remove its block from your own copy if you don't want it).
  qu-app-shell-relay:
    image: qu-app-shell-relay:latest
    build:
      context: .
      dockerfile: packages/app-shell/Dockerfile
    ports:
      - "${QU_RELAY_PORT:-8081}:8081"
    environment:
      QU_RELAY_PORT: "8081"
      QU_RELAY_DATA_DIR: /data
      # REQUIRED for this relay to actually serve an app (a PUBLIC key only - see relay-server.js's
      # own "ADMIN IDENTITY" doc comment; the container starts fine without it, serving a setup page
      # at / instead). Generate an app-admin identity yourself (QuCrypto.generateKeypair() from
      # @qu/core) and set its base64 signing pubkey here.
      QU_APP_ADMIN_PUB: ${QU_APP_ADMIN_PUB:-}
      # PLATFORM mode instead of the single app above (architecture.md §7) - takes priority over
      # QU_APP_ADMIN_PUB when both are set. JSON array of {"pub","xPub"} (base64) - every relay-admin
      # identity, all equally and symmetrically (no single "owner"), authorized to (a) write
      # qu-platform-apps (register/manage already-installed apps under path prefixes - a BRAND NEW
      # app-admin needs no separate config here at all, `registerApp()` alone is enough, discovered
      # live by this relay itself - see @qu/app-shell's own live-app-resolver.js) and (b) read/write
      # the CONFIDENTIAL admin realm's own content (architecture.md §7's "ADMIN REALM" - a wholly
      # separate Space/relay-forwarder from the main one above, reached at /admin-ws, never
      # open-join). This is the ONE static list this whole deployment needs - see @qu/space-core's
      # kinds.js/kind-schema.js own doc comment on the 'relay-admins' ACL mode, and
      # relay-server.js's own doc comment. Empty/unset still starts the admin realm (so it CAN be
      # bootstrapped - see packages/app-shell/bin/install-admin-console.mjs) but nobody can decrypt
      # anything written to it yet, and nobody can write qu-platform-apps either.
      QU_RELAY_ADMINS: ${QU_RELAY_ADMINS:-}
      # OPTIONAL - qu-page/qu-template/qu-style are 'content'-ACL (self-certifying per-owner grants,
      # @qu/app-core's kinds.js), not 'members'-ACL, so an app-admin needs no entry here just to
      # WRITE their own content. Only relevant for an app's OWN, separately-defined 'members'-ACL
      # Kinds, if any - see docs/v5-space-core-guide.md for how to generate {"pub","xPub"} entries.
      QU_MEMBERS_JSON: ${QU_MEMBERS_JSON:-}
      # Default true (unset here = true) - lets a visiting browser self-register (POST /join), which
      # a real deployment usually wants (visitors need SOME membership to even subscribe to
      # 'members'-ACL content, if you add any - see relay-server.js's own doc comment). Set to the
      # exact string "false" to lock it down.
      QU_ALLOW_JOIN: ${QU_ALLOW_JOIN:-}
      # Read by bootstrap-platform.mjs ONLY (not this relay process itself) when run via `docker
      # exec` into THIS container - points its generated relay-admin/demo-app-admin identity files
      # at the persistent volume below instead of its default (ephemeral) location next to the
      # script. See this file's own top "RUNNING IT VIA docker exec INSTEAD" comment.
      QU_BOOTSTRAP_DIR: /admin-identity
    volumes:
      - qu-app-shell-relay-data:/data
      # Survives redeploys/recreation (unlike the container's own filesystem) - see this file's own
      # top "RUNNING IT VIA docker exec INSTEAD" comment for why this exists at all. Irrelevant if
      # you bootstrap from outside the container (the documented default flow) - that path persists
      # on whatever machine you actually run bootstrap-platform.mjs from instead.
      - qu-app-shell-relay-admin-identity:/admin-identity
    restart: unless-stopped

  # THE OLD, hardcoded chat demo relay (packages/space-transport's own relay-server.js) - kept as an
  # explicit opt-in, not the default anymore: `docker compose --profile legacy-chat up -d` starts
  # BOTH this and qu-app-shell-relay above, on separate ports. Nothing here changed except which
  # service is the default - see demo/README.md's own "Real thing" section for how to use it.
  qu-space-relay:
    profiles: ["legacy-chat"]
    image: qu-space-relay:latest
    build:
      context: .
      dockerfile: packages/space-transport/Dockerfile
    ports:
      - "${QU_LEGACY_CHAT_RELAY_PORT:-8083}:8081"
    environment:
      QU_RELAY_PORT: "8081"
      QU_RELAY_DATA_DIR: /data
      # OPTIONAL - no default needed. A JSON array of every 'members'-mode
      # ACL peer's {"pub","xPub"} (base64) - see docs/v5-space-core-guide.md
      # for how to generate these, and for why 'owner'/'named'-ACL Kinds
      # need no members configured at all. Leave QU_LEGACY_CHAT_MEMBERS_JSON
      # unset in your .env / shell if you have none yet - the relay starts fine.
      QU_MEMBERS_JSON: ${QU_LEGACY_CHAT_MEMBERS_JSON:-}
      # OPTIONAL - a ws://.../wss://... URL of another relay to federate
      # with (see federation.js). This relay's OWN identity (auto-generated
      # and persisted under /data on first boot - see relay-identity.js) is
      # what authenticates it to the upstream relay.
      QU_FEDERATE_UPSTREAM_URL: ${QU_FEDERATE_UPSTREAM_URL:-}
      # Default true (unset here = true) - anyone reaching this port can
      # join the demo app at / as a new 'members'-mode member, no auth
      # beyond well-formed keys. Set to the exact string "false" to lock
      # membership to QU_LEGACY_CHAT_MEMBERS_JSON only - see relay-server.js's
      # own doc comment.
      QU_ALLOW_JOIN: ${QU_LEGACY_CHAT_ALLOW_JOIN:-}
    volumes:
      - qu-space-relay-data:/data
    restart: unless-stopped

volumes:
  qu-app-shell-relay-data:
  qu-app-shell-relay-admin-identity:
  qu-space-relay-data:
